<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <title>Visualizador de Fractales</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>

<body>
  <header>
    <h1>Explorador de Fractales Interactivo</h1>
  </header>

  <div id="fractalButtons">
    <button data-fractal="sierpinski">Triángulo de Sierpinski</button>
    <button data-fractal="koch">Curva de Koch</button>
    <button data-fractal="fractalTree">Árbol Fractal</button>
    <button data-fractal="mandelbrot">Conjunto de Mandelbrot</button>
    <button data-fractal="julia">Conjunto de Julia</button>
  </div>

  <div id="controls">
    <label>
      Profundidad: <span id="depthValue">4</span>
      <input type="range" id="depthSlider" min="1" max="8" value="4" />
    </label>

    <label>
      Rotación: <span id="rotationValue">0</span>
      <input type="range" id="rotationSlider" min="0" max="360" value="0" />
    </label>

    <button id="saveBtn">Guardar Imagen</button>
  </div>

  <script type="module" src="../main.js"></script>
</body>

</html>
